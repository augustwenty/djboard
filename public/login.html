<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJBoard · Sign in</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
  <style>
    :root {
      --bg: #0a0a0a; --panel: #111311; --border: #2a2d2a;
      --text: #e6e8e4; --muted: #8a908a; --accent: #4ade80; --danger: #f87171;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f4f4f0; --panel: #ffffff; --border: #d8dad4; --text: #1c1e1c; --muted: #6b7068; --accent: #16a34a; --danger: #dc2626; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    form {
      width: min(320px, 90vw); padding: 32px 28px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 14px;
      display: flex; flex-direction: column; gap: 14px;
    }
    h1 { margin: 0 0 4px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
    input {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; font-size: 15px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      background: var(--accent); color: #05170c; border: none; border-radius: 8px;
      padding: 10px 12px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #error { color: var(--danger); font-size: 13px; min-height: 16px; }
  </style>
</head>
<body>
  <form id="loginForm" autocomplete="off">
    <h1>🧠 DJBoard</h1>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" autofocus required />
    <div id="error"></div>
    <button type="submit">Sign in</button>
  </form>
  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/';
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const password = document.getElementById('password').value;
      const btn = form.querySelector('button');
      btn.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (res.ok) {
          location.href = next.startsWith('/') ? next : '/';
        } else {
          errorEl.textContent = 'Incorrect password.';
        }
      } catch {
        errorEl.textContent = 'Login failed — try again.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
